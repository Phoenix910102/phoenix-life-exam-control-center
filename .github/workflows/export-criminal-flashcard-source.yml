name: Export criminal flashcard source

on:
  push:
    branches:
      - "agent/add-criminal-law-flashcards"
  pull_request:
    branches:
      - "codex-progress"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Rebuild verified standalone HTML
        run: python3 criminal-law-flashcards/rebuild.py

      - name: Upload verified source
        uses: actions/upload-artifact@v4
        with:
          name: criminal-flashcard-source
          path: criminal-law-flashcards/刑法考點星圖_111-114.html
          if-no-files-found: error
          retention-days: 1
