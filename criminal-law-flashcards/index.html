<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>刑法考點星圖｜載入中</title>
  <style>
    :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #f5f0ff; background: #09070d; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 20%, #28173b 0, #110c19 38%, #070609 75%); }
    main { width: min(92vw, 560px); padding: 42px; border: 1px solid rgba(213,183,255,.24); border-radius: 28px; background: rgba(15,10,23,.76); box-shadow: 0 28px 90px rgba(0,0,0,.48); backdrop-filter: blur(18px); }
    .eyebrow { margin: 0 0 12px; color: #c9a7ff; letter-spacing: .16em; text-transform: uppercase; font-size: .78rem; }
    h1 { margin: 0; font-size: clamp(2rem, 8vw, 3.6rem); line-height: 1.05; }
    p { margin: 18px 0 0; line-height: 1.7; color: #c9c2d1; }
    .bar { margin-top: 28px; height: 8px; overflow: hidden; border-radius: 999px; background: rgba(255,255,255,.08); }
    .bar::after { content: ""; display: block; width: 42%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #b27cff, #e4c8ff); animation: loading 1.1s ease-in-out infinite alternate; }
    .error { color: #ffb4c2; }
    @keyframes loading { from { transform: translateX(-100%); } to { transform: translateX(238%); } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Phoenix Exam Control Center</p>
    <h1>刑法考點星圖</h1>
    <p id="status" role="status">正在載入 111–114 年互動詞卡與真題資料……</p>
    <div class="bar" aria-hidden="true"></div>
  </main>
  <script>
    (async () => {
      const partCount = 9;
      const paths = Array.from({ length: partCount }, (_, index) =>
        `payload/part-${String(index).padStart(2, "0")}.b64`
      );
      const chunks = [];
      for (const path of paths) {
        const response = await fetch(path, { cache: "no-store" });
        if (!response.ok) throw new Error(`${path} 載入失敗（HTTP ${response.status}）`);
        chunks.push((await response.text()).trim());
      }
      if (!("DecompressionStream" in window)) {
        throw new Error("瀏覽器不支援 gzip 解壓縮，請改用新版 Safari、Chrome、Edge 或 Firefox；或依 README 執行 rebuild.py。 ");
      }
      const binary = atob(chunks.join(""));
      const compressed = Uint8Array.from(binary, character => character.charCodeAt(0));
      const stream = new Blob([compressed]).stream().pipeThrough(new DecompressionStream("gzip"));
      const html = await new Response(stream).text();
      document.open();
      document.write(html);
      document.close();
    })().catch(error => {
      const status = document.getElementById("status");
      status.classList.add("error");
      status.textContent = `載入失敗：${error.message}`;
      document.querySelector(".bar")?.remove();
      console.error(error);
    });
  </script>
</body>
</html>
