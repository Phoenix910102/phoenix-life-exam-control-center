  <style>

*{box-sizing:border-box}

.rail-btn span{display:block;line-height:1.2}

.app-shell{margin-left:124px;max-width:1440px;padding:28px 34px 80px}

.top-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

}
select{min-width:290px}.ghost-btn{cursor:pointer}.ghost-btn:hover{border-color:rgba(200,169,106,.38);background:rgba(200,169,106,.08)}

.section-title{font:900 32px/1.2 var(--serif);margin:42px 0 18px}.subtle{color:var(--muted);line-height:1.8}.roadmap{display:grid;grid-template-columns:repeat(9,minmax(126px,1fr));gap:12px;align-items:stretch;margin-top:26px}.road-node{border:1px solid var(--line);background:rgba(29,26,23,.76);border-radius:22px;padding:18px;min-height:190px;cursor:pointer;transition:.2s ease;position:relative;overflow:hidden}.road-node::before{content:attr(data-level);font:700 11px/1 var(--mono);color:var(--gold);letter-spacing:.08em}.road-node h3{font:900 22px/1.2 var(--serif);margin:16px 0 10px}.road-node p{font-size:13px;color:var(--muted);line-height:1.55}.road-node:hover{transform:translateY(-5px);border-color:rgba(200,169,106,.38);background:rgba(43,37,31,.82)}.road-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.pill{font:700 11px/1 var(--mono);border:1px solid var(--line);border-radius:999px;padding:6px 8px;color:var(--silver);background:rgba(255,255,255,.03)}.pill.red{color:#ffb6bd;border-color:rgba(193,73,83,.35);background:rgba(139,38,53,.12)}.pill.gold{color:#f1d79c;border-color:rgba(200,169,106,.35);background:rgba(200,169,106,.1)}
.layout{display:grid;grid-template-columns:270px minmax(0,1fr) 300px;gap:20px}.toc,.neural,.panel{border:1px solid var(--line);background:rgba(29,26,23,.72);border-radius:26px;box-shadow:0 18px 50px rgba(0,0,0,.22)}.toc,.neural{position:sticky;top:22px;align-self:start;max-height:calc(100vh - 44px);overflow:auto;padding:16px}.toc button{width:100%;text-align:left;border:0;background:transparent;color:var(--muted);padding:12px;border-radius:14px;cursor:pointer;font-size:14px}.toc button:hover,.toc button.is-active{color:var(--text);background:rgba(200,169,106,.08)}.toc small{font-family:var(--mono);color:var(--gold);margin-right:8px}.chapter-card{border:1px solid var(--line);background:linear-gradient(180deg,rgba(36,32,28,.86),rgba(25,23,20,.76));border-radius:30px;padding:32px;box-shadow:var(--shadow);margin-bottom:22px}.chapter-card h2{font:900 42px/1.15 var(--serif);margin:0 0 10px}.chapter-no{font:700 13px/1 var(--mono);color:var(--gold);letter-spacing:.14em}.lead{font-size:18px;line-height:1.85;color:var(--muted);border-left:3px solid var(--red2);padding-left:18px}.one-line{font:700 20px/1.6 var(--serif);color:#f2e7d8;margin:18px 0}.article-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:18px 0}.article{border:1px solid var(--line);border-radius:18px;padding:14px;background:rgba(255,255,255,.025)}.article code{font-family:var(--mono);color:var(--gold);display:block;margin-bottom:8px}.article span{color:var(--muted);line-height:1.6}.info-list{display:grid;gap:10px;margin:18px 0}.info-list li{list-style:none;border-left:3px solid rgba(200,169,106,.55);padding:10px 14px;background:rgba(255,255,255,.03);border-radius:0 14px 14px 0;color:var(--text);line-height:1.65}.example,.issue,.trap-box{border-radius:22px;padding:20px;margin:18px 0;line-height:1.8}.example{border:1px solid rgba(200,169,106,.24);background:rgba(200,169,106,.08)}.issue{border:1px solid rgba(191,195,199,.2);background:rgba(191,195,199,.07)}.trap-box{border:1px solid rgba(193,73,83,.32);background:rgba(139,38,53,.14)}.block-title{font:800 13px/1 var(--mono);letter-spacing:.12em;color:var(--gold);margin:0 0 10px;text-transform:uppercase}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{font:700 12px/1 var(--mono);padding:7px 10px;border-radius:999px;background:rgba(139,38,53,.16);border:1px solid rgba(193,73,83,.32);color:#ffc2c7}.neural h3{font:900 22px/1.25 var(--serif);margin:0 0 16px}.neural dl{display:grid;gap:12px}.neural dt{font:700 11px/1 var(--mono);color:var(--gold);letter-spacing:.12em}.neural dd{margin:4px 0 0;color:var(--muted);line-height:1.55}.source-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:18px}.source{border:1px solid var(--line);border-radius:18px;padding:16px;background:rgba(255,255,255,.03)}.source strong{display:block;margin-bottom:8px}.source p{font-size:13px;color:var(--muted);line-height:1.55}.source a{color:var(--gold);font-family:var(--mono);font-size:12px;text-decoration:none}
.lesson-wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px}.slide{min-height:620px;border:1px solid var(--line);border-radius:36px;background:linear-gradient(135deg,rgba(29,26,23,.9),rgba(13,12,11,.82));box-shadow:var(--shadow);padding:46px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}.slide::before{content:attr(data-slide);position:absolute;right:36px;top:28px;font:700 13px/1 var(--mono);color:var(--gold)}.slide h2{font:900 clamp(36px,4vw,64px)/1.12 var(--serif);margin:0 0 20px}.slide p,.slide li{font-size:22px;line-height:1.8;color:var(--text)}.slide .muted{color:var(--muted)}.lesson-controls{display:flex;gap:10px;margin-top:14px}.action-btn{border:1px solid rgba(200,169,106,.28);background:rgba(200,169,106,.09);color:var(--text);padding:13px 16px;border-radius:16px;cursor:pointer;font-weight:700}.action-btn:hover{background:rgba(200,169,106,.16)}.lesson-side{padding:22px}.progress{height:10px;background:rgba(255,255,255,.05);border-radius:999px;overflow:hidden;margin:12px 0 20px}.progress span{display:block;height:100%;background:linear-gradient(90deg,var(--red2),var(--gold));width:0%}.duel-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.duel-card{border:1px solid var(--line);border-radius:28px;padding:24px;background:rgba(29,26,23,.74);box-shadow:0 18px 50px rgba(0,0,0,.2)}.duel-card h3{font:900 28px/1.2 var(--serif);margin:0 0 12px}.signal{color:var(--gold);font-family:var(--mono);font-size:13px;line-height:1.6}.side{border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;background:rgba(255,255,255,.025)}.side strong{color:#fff}.verdict{border-left:3px solid var(--red2);padding:14px 16px;background:rgba(139,38,53,.12);border-radius:0 16px 16px 0;line-height:1.7}.exam-grid,.trap-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.exam-card,.trap-card,.quiz-card,.diag-card{border:1px solid var(--line);background:rgba(29,26,23,.78);border-radius:24px;padding:22px;box-shadow:0 16px 40px rgba(0,0,0,.18)}.exam-card h3,.trap-card h3{font:900 26px/1.2 var(--serif);margin:8px 0 10px}.tag{display:inline-flex;font:800 12px/1 var(--mono);color:#ffc2c7;background:rgba(139,38,53,.16);border:1px solid rgba(193,73,83,.35);border-radius:999px;padding:7px 10px}.reveal{display:none;margin-top:12px;padding:14px;border-radius:16px;background:rgba(200,169,106,.08);line-height:1.7}.reveal.is-visible{display:block}.diag-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.diag-steps label{display:block;border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;background:rgba(255,255,255,.025);cursor:pointer}.diag-output{white-space:pre-line;line-height:1.75;color:var(--text);background:rgba(0,0,0,.18);border-radius:20px;padding:18px}.trap-form{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}.trap-form textarea{grid-column:1 / -1;min-height:90px;resize:vertical}.trap-card strong{display:block;color:var(--gold);margin-bottom:6px}.trap-card p{color:var(--muted);line-height:1.65}.quiz-options{display:grid;gap:10px;margin-top:18px}.quiz-options button{text-align:left;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.03);color:var(--text);padding:15px;cursor:pointer}.quiz-options button:hover{border-color:rgba(200,169,106,.35)}.quiz-options button.correct{border-color:rgba(138,181,154,.7);background:rgba(138,181,154,.15)}.quiz-options button.wrong{border-color:rgba(193,73,83,.7);background:rgba(193,73,83,.15)}.quiz-result{margin-top:16px;line-height:1.7;color:var(--muted)}
@media(max-width:1180px){.roadmap{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:1fr}.toc,.neural{position:static;max-height:none}.source-list{grid-template-columns:repeat(2,1fr)}.lesson-wrap,.diag-grid{grid-template-columns:1fr}.duel-grid,.exam-grid,.trap-grid{grid-template-columns:1fr}}

</style>

  <script>
const DATA = window.CRL_DATA;
let state = { view: 'home', chapter: 0, slide: 0, quizIndex: 0, quizScore: 0, answered: false };
const $ = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));
const esc = s => String(s ?? '').replace(/[&<>'"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[m]));

function init(){
  renderChapterSelect();
  renderHome();
  renderReader();

  renderDuel();
  renderExam();
  renderDiagnostic();
  renderTraps();
  renderQuiz();
  bindGlobal();
}
function bindGlobal(){
  $$('.rail-btn').forEach(btn => btn.addEventListener('click', () => setView(btn.dataset.view)));

  $('#printBtn').addEventListener('click', () => window.print());
}
function setView(view){
  state.view = view;
  $$('.view').forEach(v => v.classList.toggle('is-visible', v.id === view));
  $$('.rail-btn').forEach(b => b.classList.toggle('is-active', b.dataset.view === view));

  window.scrollTo({top:0, behavior:'smooth'});
}
function renderChapterSelect(){

}

}
function chapterToc(active=state.chapter){
  return `<nav class="toc"><p class="block-title">Chapters</p>${DATA.chapters.map((c,i)=>`<button class="${i===active?'is-active':''}" data-chapter="${i}"><small>${c.no}</small>${esc(c.title)}</button>`).join('')}</nav>`;

    {t:`${c.no}｜${c.title}`, p:c.oneLine, sub:c.lead},
    {t:'條文地圖', html:`<div class="article-grid">${c.articles.map(a=>`<div class="article"><code>${esc(a.art)}</code><span>${esc(a.key)}</span></div>`).join('')}</div>`},
    {t:'概念框架', html:`<ul>${c.bullets.map(b=>`<li>${esc(b)}</li>`).join('')}</ul>`},
    {t:'簡單例子', p:c.example},
    {t:'爭點 / 陷阱', html:`${c.issue?`<p>${esc(c.issue)}</p>`:''}<ul>${c.traps.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`},
    {t:'考古題信號', html:`<p class="muted">看到這些標籤，就把題幹先貼到本章。</p><div class="chips">${c.exams.map(e=>`<span class="chip">${esc(e)}</span>`).join('')}</div>`},
    {t:'我問妳一句', p:c.quiz.q, sub:c.quiz.a}
  ];
  const s = slides[state.slide] || slides[0];
  return {total:slides.length, html:`<div class="slide" data-slide="${state.slide+1}/${slides.length}"><h2>${esc(s.t)}</h2>${s.html || `<p>${esc(s.p)}</p>${s.sub?`<p class="muted">${esc(s.sub)}</p>`:''}`}</div>`};
}
function renderLesson(){
  const c = DATA.chapters[state.chapter];
  const s = slideHTML(c);
  $('#lesson').innerHTML = `<div class="lesson-wrap"><div><div id="slideMount">${s.html}</div><div class="lesson-controls"><button class="action-btn" id="prevSlide">上一屏</button><button class="action-btn" id="nextSlide">下一屏</button><button class="ghost-btn" id="toReader">展開閱讀</button></div></div><aside class="panel lesson-side"><p class="block-title">上課模式</p><h3>${esc(c.title)}</h3><div class="progress"><span style="width:${((state.slide+1)/s.total)*100}%"></span></div><p class="subtle">一次只亮一個變數。妳不用吞整章，跟著屏幕走：定位、條文、框架、例子、爭點、考古、提問。</p><div class="chips">${c.exams.map(e=>`<span class="chip">${esc(e)}</span>`).join('')}</div></aside></div>`;
  $('#prevSlide').addEventListener('click',()=>{state.slide=Math.max(0,state.slide-1);renderLesson();});
  $('#nextSlide').addEventListener('click',()=>{state.slide=Math.min(s.total-1,state.slide+1);renderLesson();});
  $('#toReader').addEventListener('click',()=>setView('reader'));
}
function renderDuel(){
  $('#duel').innerHTML = `<h2 class="section-title">爭點決鬥模式</h2><p class="subtle">每個爭點都用左右對戰拆解：A 說什麼、B 說什麼、考試安全寫法是什麼。</p><div class="duel-grid">${DATA.debates.map(d=>`
    <article class="duel-card"><h3>${esc(d.title)}</h3><p class="signal">${esc(d.signal)}</p>${d.sides.map(s=>`<div class="side"><strong>${esc(s.name)}</strong><p>${esc(s.claim)}</p><p class="subtle">${esc(s.exam)}</p></div>`).join('')}<div class="verdict">${esc(d.verdict)}</div></article>`).join('')}</div>`;
}
function renderExam(){
  $('#exam').innerHTML = `<h2 class="section-title">考古題反射模式</h2><p class="subtle">先不要背答案。每張卡訓練妳看到題幹信號就知道該貼哪個刑總標籤。</p><div class="exam-grid">${DATA.examCards.map((e,i)=>`
    <article class="exam-card"><span class="tag">${esc(e.tag)}</span><h3>${esc(e.topic)}</h3><p class="signal">題幹信號：${esc(e.signal)}</p><p>${esc(e.ask)}</p><button class="ghost-btn" data-reveal="${i}">顯示反射答案</button><div class="reveal" id="reveal-${i}">${esc(e.answer)}</div></article>`).join('')}</div>`;
  $$('[data-reveal]').forEach(b=>b.addEventListener('click',()=>$('#reveal-'+b.dataset.reveal).classList.toggle('is-visible')));
}
function renderDiagnostic(){
  $('#diagnostic').innerHTML = `<h2 class="section-title">三階層診斷器</h2><p class="subtle">輸入一個簡短案例，勾選妳目前判斷。我會輸出一份答題骨架，逼妳按順序檢查。</p><div class="diag-grid"><div class="diag-card"><textarea id="caseText" placeholder="例：甲誤以為乙正在攻擊丙，拿石頭砸乙，事後發現乙丙在拍電影。"></textarea><div class="diag-steps">
  ${['有刑法行為','構成要件可能該當','有因果與客觀歸責問題','可能有阻卻違法事由','可能有責任能力／違法性錯誤問題','可能有未遂／共犯／罪數問題'].map((x,i)=>`<label><input type="checkbox" value="${i}"> ${x}</label>`).join('')}
  </div><button class="action-btn" id="runDiag">生成答題骨架</button></div><div class="diag-card"><p class="block-title">輸出</p><div id="diagOutput" class="diag-output">妳的診斷會出現在這裡。</div></div></div>`;
  $('#runDiag').addEventListener('click',()=>{
    const text = $('#caseText').value.trim() || '（未輸入案例）';
    const checked = $$('#diagnostic input:checked').map(i=>Number(i.value));
    const lines = [`案例：${text}`,'','答題骨架：','1. 刑法行為：先確認是否為有意識或可歸屬於人的外在舉止。','2. 構成要件：列出可能罪名，檢查客觀要件與主觀要件。','3. 因果／歸責：若有結果犯，檢查條件關係、風險創造與風險實現。','4. 違法性：檢查正當防衛、緊急避難、承諾、依法令或業務正當。','5. 責任：檢查責任能力、違法性意識、期待可能性與原因自由行為。','6. 罪數／效果：最後處理未遂、共犯、競合、刑罰與沒收。','','妳已標記：'];
    const names=['刑法行為','構成要件','因果與客觀歸責','違法性','責任','未遂／共犯／罪數'];
    lines.push(checked.length?checked.map(i=>'・'+names[i]).join('\n'):'尚未勾選。請先不要急著下結論。');
    $('#diagOutput').textContent = lines.join('\n');
  });
}
function getUserTraps(){ try{return JSON.parse(localStorage.getItem('crl_traps')||'[]')}catch{return[]} }
function setUserTraps(x){ localStorage.setItem('crl_traps',JSON.stringify(x)); }
function renderTraps(){
  const all=[...DATA.traps,...getUserTraps()];
  $('#traps').innerHTML = `<h2 class="section-title">陷阱本</h2><p class="subtle">這裡不是普通錯題本，而是專門收「我原本以為」與「下次看到什麼字要警覺」。新增內容會存在妳的瀏覽器 localStorage。</p><div class="trap-form"><input id="trapWrong" placeholder="我原本以為……"><input id="trapCue" placeholder="下次看到什麼字要警覺……"><textarea id="trapFix" placeholder="正確位置／為什麼會錯……"></textarea><button class="action-btn" id="addTrap">加入陷阱本</button><button class="ghost-btn" id="clearTraps">清空我新增的陷阱</button></div><div class="trap-grid">${all.map(t=>`<article class="trap-card"><strong>我原本以為</strong><p>${esc(t.wrong)}</p><strong>正確位置</strong><p>${esc(t.fix)}</p><strong>下次警覺</strong><p>${esc(t.cue)}</p></article>`).join('')}</div>`;
  $('#addTrap').addEventListener('click',()=>{const wrong=$('#trapWrong').value.trim(), fix=$('#trapFix').value.trim(), cue=$('#trapCue').value.trim(); if(!wrong||!fix) return; const items=getUserTraps(); items.unshift({wrong,fix,cue:cue||'未設定'}); setUserTraps(items); renderTraps();});
  $('#clearTraps').addEventListener('click',()=>{setUserTraps([]);renderTraps();});
}
function renderQuiz(){
  const q = DATA.quizBank[state.quizIndex];
  $('#quiz').innerHTML = `<h2 class="section-title">Quick Quiz</h2><div class="quiz-card"><p class="block-title">${state.quizIndex+1}/${DATA.quizBank.length}｜目前得分 ${state.quizScore}</p><h3>${esc(q.q)}</h3><div class="quiz-options">${q.options.map((o,i)=>`<button data-opt="${i}">${esc(o)}</button>`).join('')}</div><div class="quiz-result" id="quizResult"></div><div class="lesson-controls"><button class="ghost-btn" id="resetQuiz">重新開始</button><button class="action-btn" id="nextQuiz">下一題</button></div></div>`;
  $$('#quiz [data-opt]').forEach(btn=>btn.addEventListener('click',()=>{
    if(state.answered) return;
    state.answered=true;
    const i=Number(btn.dataset.opt);
    if(i===q.a){state.quizScore++; btn.classList.add('correct');} else {btn.classList.add('wrong'); $(`#quiz [data-opt="${q.a}"]`).classList.add('correct');}
    $('#quizResult').innerHTML = `<strong>${i===q.a?'正確':'再抓一次題幹信號。'}</strong><br>${esc(q.why)}`;
  }));
  $('#nextQuiz').addEventListener('click',()=>{state.quizIndex=(state.quizIndex+1)%DATA.quizBank.length; state.answered=false; renderQuiz();});
  $('#resetQuiz').addEventListener('click',()=>{state.quizIndex=0; state.quizScore=0; state.answered=false; renderQuiz();});
}

    <div class="crf-hydration-actions" data-crf-hydration-actions hidden>
      <button class="crf-btn blue" data-crf-action="drink">已喝水</button>
      <button class="crf-btn" data-crf-action="no-water">我真的沒有水</button>
    </div>
  </div>
</div>
<script>
(() => {
  const KEY = "criminalRoseFloatingConsole_v1";
  const ASSETS = {
    battle: "assets/battle.png",
    drink: "assets/drink.png",
    eat: "assets/eat.png",
    runner: "assets/progress_run_right.png"
  };
  const DATA = window.CRL_DATA || { chapters: [], traps: [], quizBank: [] };
  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
  const panel = $("#crf-console");
  const vine = $("#crf-vine");
  const overlay = $("#crf-hydration-overlay");
  const esc = value => String(value ?? "").replace(/[&<>'"]/g, m => ({ "&":"&amp;","<":"&lt;",">":"&gt;","'":"&#039;",'"':"&quot;" }[m]));
  const nowISO = () => new Date().toISOString();
  const taipeiDay = (date = new Date()) => new Intl.DateTimeFormat("en-CA", { timeZone:"Asia/Taipei", year:"numeric", month:"2-digit", day:"2-digit" }).format(date);
  const chapterItems = chapter => [
    `條文地圖：${chapter.articles?.map(a => a.art).join("、") || "本章條文"}`,
    "概念框架",
    "簡單例子",
    chapter.issue ? "爭點拆解" : "易錯陷阱",
    "考古題信號",
    "Rékaí 問答",
    "本章小測通過"
  ];
  const defaultState = () => ({
    collapsed:false,
    hideDone:false,
    panelPosition:null,
    mode:"study",
    message:"刑總主線啟動｜先穩三階層。",
    chapters:Object.fromEntries(DATA.chapters.map(ch => [ch.id, Array(chapterItems(ch).length).fill(false)])),
    expanded:Object.fromEntries(DATA.chapters.map((ch, i) => [ch.id, i < 2])),
    hydration:{
      intervalMinutes:25,
      softOverlayDelayMinutes:10,
      takeoverDelayMinutes:15,
      lastDrinkAt:null,
      nextDrinkAt:null,
      reminderShownAt:null,
      softOverlayAt:null,
      takeoverAt:null,
      waterCountToday:0,
      waterCountDate:null,
      isReminderActive:false,
      overlayLevel:"none",
      snoozeUntil:null
    },
    meal:{ countToday:0, countDate:null, total:0, lastMealAt:null },
    sleepEndAt:null,
    lastTaskCompletedAt:null
  });
  let state = loadState();
  let toast = "";
  let lastModeBeforeHydration = "study";
  let timer = null;

  function loadState(){
    try{
      const saved = JSON.parse(localStorage.getItem(KEY) || "null");
      const base = defaultState();
      if(!saved || typeof saved !== "object") return normalizeState(base);
      return normalizeState({ ...base, ...saved, hydration:{ ...base.hydration, ...(saved.hydration || {}) }, meal:{ ...base.meal, ...(saved.meal || {}) } });
    }catch{
      localStorage.removeItem(KEY);
      toast = "進度資料損壞，已重設";
      return normalizeState(defaultState());
    }
  }
  function normalizeState(input){
    const today = taipeiDay();
    DATA.chapters.forEach(ch => {
      const count = chapterItems(ch).length;
      if(!Array.isArray(input.chapters[ch.id])) input.chapters[ch.id] = Array(count).fill(false);
      input.chapters[ch.id] = input.chapters[ch.id].slice(0, count).concat(Array(Math.max(0, count - input.chapters[ch.id].length)).fill(false));
      if(typeof input.expanded[ch.id] !== "boolean") input.expanded[ch.id] = false;
    });
    if(input.hydration.waterCountDate !== today){ input.hydration.waterCountDate = today; input.hydration.waterCountToday = 0; }
    if(input.meal.countDate !== today){ input.meal.countDate = today; input.meal.countToday = 0; }
    const now = Date.now();
    if(!input.hydration.lastDrinkAt) input.hydration.lastDrinkAt = new Date(now).toISOString();
    scheduleHydration(input, new Date(input.hydration.lastDrinkAt).getTime());
    return input;
  }
  function scheduleHydration(target, fromMs){
    const h = target.hydration;
    const next = fromMs + h.intervalMinutes * 60000;
    h.nextDrinkAt = new Date(next).toISOString();
    h.softOverlayAt = new Date(next + h.softOverlayDelayMinutes * 60000).toISOString();
    h.takeoverAt = new Date(next + h.takeoverDelayMinutes * 60000).toISOString();
  }
  function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }
  function percent(){
    const total = DATA.chapters.reduce((sum, ch) => sum + chapterItems(ch).length, 0);
    const done = DATA.chapters.reduce((sum, ch) => sum + (state.chapters[ch.id] || []).filter(Boolean).length, 0);
    return total ? Math.round(done / total * 100) : 0;
  }
  function chapterDone(ch){ return (state.chapters[ch.id] || []).every(Boolean); }
  function doneChapters(){ return DATA.chapters.filter(chapterDone).length; }
  function activeChapter(){
    return DATA.chapters.find(ch => !chapterDone(ch)) || DATA.chapters[DATA.chapters.length - 1] || { title:"教材" };
  }
  function formatCountdown(ms, withUnits = false){
    const total = Math.max(0, Math.floor(ms / 1000));
    const h = Math.floor(total / 3600);
    const m = Math.floor((total % 3600) / 60);
    const s = total % 60;
    if(withUnits) return h > 0 ? `${h} 小時 ${String(m).padStart(2,"0")} 分 ${String(s).padStart(2,"0")} 秒` : `${m} 分 ${String(s).padStart(2,"0")} 秒`;
    return h > 0 ? `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}` : `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  }
  function currentImage(){
    if(state.mode === "hydration") return ASSETS.drink;
    if(state.mode === "meal") return ASSETS.eat;
    return ASSETS.battle;
  }
  function render(){
    const p = percent();
    const current = activeChapter();
    const sleepActive = state.sleepEndAt && new Date(state.sleepEndAt).getTime() > Date.now();
    panel.className = state.collapsed ? "crf-collapsed" : "";
    if(state.panelPosition){ panel.style.left = `${state.panelPosition.x}px`; panel.style.top = `${state.panelPosition.y}px`; panel.style.right = "auto"; panel.style.bottom = "auto"; }
    panel.innerHTML = `
      <div class="crf-ripple"></div>
      <div class="crf-shell">
        <div class="crf-top" data-crf-drag-handle>
          <div class="crf-avatar"><img src="${esc(currentImage())}" alt=""><span>⚔️</span><b class="crf-percent">${p}%</b></div>
          <div>
            <p class="crf-title">罪責玫瑰控制台</p>
            <p class="crf-status">${esc(state.message || `下一章：${current.title}`)}</p>
            <p class="crf-note">${sleepActive ? "睡眠模式倒數中" : `目前：${esc(current.title)}`}</p>
          </div>
          <button class="crf-toggle" data-crf-action="toggle">${state.collapsed ? "展開" : "收合"}</button>
        </div>
        <div class="crf-mini-route">
          <div class="crf-mini-fill"></div>
          <div class="crf-mini-runner"><img src="${esc(ASSETS.runner)}" alt=""><span>🌹⚔️</span></div>
        </div>
        <div class="crf-panel">
          ${toast ? `<div class="crf-card"><strong>${esc(toast)}</strong></div>` : ""}
          <div class="crf-grid">
            <div class="crf-stat"><b>${p}%</b><span>總進度</span></div>
            <div class="crf-stat"><b>${doneChapters()}/${DATA.chapters.length}</b><span>章節封存</span></div>
            <div class="crf-stat"><b>${DATA.traps?.length || 0}</b><span>內建陷阱</span></div>
          </div>
          <div class="crf-card">
            <h3>快捷作戰</h3>
            <div class="crf-actions">
              <button class="crf-btn primary" data-crf-action="next-item">下一項完成</button>
              <button class="crf-btn" data-crf-action="open-reader">打開目前章</button>
              <button class="crf-btn" data-crf-action="open-quiz">快問快答</button>
              <button class="crf-btn" data-crf-action="toggle-hide">${state.hideDone ? "顯示已完成" : "隱藏已完成"}</button>
              <button class="crf-btn danger" data-crf-action="reset">重設歸零</button>
            </div>
          </div>
          <div class="crf-card crf-hydration" data-crf-hydration-box>
            <h3 data-crf-hydration-heading>喝水監控</h3>
            <div class="crf-time" data-crf-hydration-time>--:--</div>
            <p class="crf-soft" data-crf-hydration-meta>每 25 分鐘提醒一次</p>
            <div class="crf-actions" data-crf-hydration-buttons>
              <button class="crf-btn blue" data-crf-action="drink">已喝水</button>
              <button class="crf-btn gold" data-crf-action="meal">吃飯 +1</button>
              <button class="crf-btn" data-crf-action="sleep">睡 30 分鐘</button>
              ${sleepActive ? `<button class="crf-btn danger" data-crf-action="cancel-sleep">取消睡眠</button>` : ""}
            </div>
          </div>
          <div class="crf-card">
            <h3>今日補給</h3>
            <p class="crf-soft">喝水 <strong data-crf-water-count>${state.hydration.waterCountToday}</strong> 次｜吃飯 <strong data-crf-meal-count>${state.meal.countToday}</strong> 次</p>
            <p class="crf-soft" data-crf-sleep-countdown>${sleepActive ? `睡眠倒數：${formatCountdown(new Date(state.sleepEndAt).getTime() - Date.now(), true)}` : "睡眠：未啟動"}</p>
          </div>
          <div class="crf-card">
            <h3>章節任務地圖</h3>
            <div class="crf-actions" style="margin-bottom:8px">
              <button class="crf-btn" data-crf-action="expand-all">全部展開</button>
              <button class="crf-btn" data-crf-action="collapse-all">全部收合</button>
            </div>
            <div class="crf-chapters">
              ${DATA.chapters.map((ch, index) => chapterHTML(ch, index)).join("")}
            </div>
          </div>
        </div>
      </div>`;
    toast = "";
    updateProgressVisuals();
    bindAssetFallbacks(panel);
  }
  function chapterHTML(ch, index){
    const checks = state.chapters[ch.id] || [];
    const done = chapterDone(ch);
    const items = chapterItems(ch);
    return `<details class="crf-chapter ${done ? "done" : ""}" data-crf-chapter="${esc(ch.id)}" ${state.expanded[ch.id] ? "open" : ""} ${state.hideDone && done ? "hidden" : ""}>
      <summary class="crf-summary">
        <input type="checkbox" data-crf-chapter-check="${esc(ch.id)}" ${done ? "checked" : ""}>
        <span class="crf-ch-title">${esc(ch.no)}｜${esc(ch.title)}</span>
        <span class="crf-chip">${checks.filter(Boolean).length}/${items.length}</span>
      </summary>
      <div class="crf-items">
        ${items.map((item, i) => `<label class="crf-item"><input type="checkbox" data-crf-item="${esc(ch.id)}" data-crf-item-index="${i}" ${checks[i] ? "checked" : ""}><span>${esc(item)}</span></label>`).join("")}
        <div class="crf-actions"><button class="crf-btn" data-crf-go-chapter="${index}">前往本章</button><button class="crf-btn gold" data-crf-seal="${esc(ch.id)}">封存本章</button></div>
      </div>
    </details>`;
  }
  function bindAssetFallbacks(root){
    $$("img", root).forEach(img => {
      img.onerror = () => img.parentElement?.classList.add("failed");
    });
  }
  function updateProgressVisuals(){
    const p = percent();
    const ratio = Math.max(.01, p / 100);
    panel.style.setProperty("--crf-ratio", ratio);
    const miniRoute = $(".crf-mini-route", panel);
    const miniRunner = $(".crf-mini-runner", panel);
    if(miniRoute && miniRunner){
      const w = miniRoute.clientWidth || 300;
      const rw = miniRunner.clientWidth || 128;
      miniRunner.style.left = `${Math.max(12, Math.min((w - 28) * ratio + 14 - rw * .35, w - rw - 6))}px`;
    }
    vine.style.setProperty("--crf-vine-ratio", ratio);
    const count = DATA.chapters.length || 1;
    vine.innerHTML = `<div class="crf-vine-track"><div class="crf-vine-fill"></div></div>${DATA.chapters.map((ch, i) => `<span class="crf-vine-node ${chapterDone(ch) ? "done" : ""}" style="left:${count === 1 ? 50 : (i / (count - 1) * 100).toFixed(3)}%" title="${esc(ch.title)}">✦</span>`).join("")}<div class="crf-runner"><img src="${esc(ASSETS.runner)}" alt=""><span>🌹⚔️</span></div>`;
    const runner = $(".crf-runner", vine);
    const trackWidth = vine.clientWidth - 40;
    const runnerWidth = runner?.clientWidth || 176;
    const target = 20 + trackWidth * ratio - runnerWidth * .35;
    if(runner) runner.style.left = `${Math.max(8, Math.min(target, vine.clientWidth - runnerWidth - 8))}px`;
    bindAssetFallbacks(vine);
  }
  function markNext(){
    for(const ch of DATA.chapters){
      const arr = state.chapters[ch.id];
      const idx = arr.findIndex(v => !v);
      if(idx >= 0){
        arr[idx] = true;
        state.expanded[ch.id] = true;
        state.lastTaskCompletedAt = nowISO();
        state.message = `${ch.no} ${ch.title}｜已完成：${chapterItems(ch)[idx]}`;
        if(arr.every(Boolean)) state.message = `${ch.no} 已封存｜下一章：${activeChapter().title}`;
        save(); render(); return;
      }
    }
    state.mode = "complete";
    state.message = "主線已完成｜可以進入考古反射。";
    save(); render();
  }
  function sealChapter(id){
    const ch = DATA.chapters.find(item => item.id === id);
    if(!ch) return;
    state.chapters[id] = state.chapters[id].map(() => true);
    state.expanded[id] = false;
    state.lastTaskCompletedAt = nowISO();
    const next = DATA.chapters.find(item => !chapterDone(item));
    state.message = next ? `${ch.no} 已封存｜下一章：${next.title}` : "主線已完成｜進入考古反射";
    save(); render();
  }
  function openView(view){
    const btn = document.querySelector(`.rail-btn[data-view="${view}"]`);
    if(btn) btn.click();
  }
  function openChapter(index){
    const select = document.getElementById("chapterSelect");
    if(select){ select.value = String(index); select.dispatchEvent(new Event("change", { bubbles:true })); }
    openView("reader");
  }
  function resetAll(){
    state = normalizeState(defaultState());
    state.message = "進度已歸零｜從刑總地圖重新開戰。";
    save(); render();
  }
  function confirmHydration(){
    const now = Date.now();
    const h = state.hydration;
    h.waterCountDate = taipeiDay();
    h.waterCountToday += 1;
    h.lastDrinkAt = new Date(now).toISOString();
    h.reminderShownAt = null;
    h.isReminderActive = false;
    h.overlayLevel = "none";
    h.snoozeUntil = null;
    scheduleHydration(state, now);
    overlay.hidden = true;
    overlay.classList.remove("takeover");
    state.mode = lastModeBeforeHydration || "study";
    state.message = "很好，回來。下一題。";
    save(); render();
  }
  function noWater(){
    const h = state.hydration;
    h.snoozeUntil = new Date(Date.now() + 5 * 60000).toISOString();
    h.overlayLevel = "reminder";
    state.message = "去拿水。這不是建議。";
    overlay.hidden = true;
    overlay.classList.remove("takeover");
    save(); render();
  }
  function startMeal(){
    state.meal.countDate = taipeiDay();
    state.meal.countToday += 1;
    state.meal.total += 1;
    state.meal.lastMealAt = nowISO();
    state.mode = "meal";
    state.message = "吃飯不是逃跑，是補給。";
    save(); render();
    setTimeout(() => { if(state.mode === "meal"){ state.mode = "study"; state.message = "補給完成｜回教材。"; save(); render(); } }, 10000);
  }
  function startSleep(){
    state.sleepEndAt = new Date(Date.now() + 30 * 60000).toISOString();
    state.mode = "sleep";
    state.message = "睡 30 分鐘。醒來接刑總主線。";
    save(); render();
  }
  function updateHydrationCountdown(){
    const h = state.hydration;
    const now = Date.now();
    const today = taipeiDay();
    if(h.waterCountDate !== today){ h.waterCountDate = today; h.waterCountToday = 0; save(); render(); return; }
    const box = $("[data-crf-hydration-box]", panel);
    const heading = $("[data-crf-hydration-heading]", panel);
    const time = $("[data-crf-hydration-time]", panel);
    const meta = $("[data-crf-hydration-meta]", panel);
    const water = $("[data-crf-water-count]", panel);
    const meal = $("[data-crf-meal-count]", panel);
    const sleep = $("[data-crf-sleep-countdown]", panel);
    if(water) water.textContent = h.waterCountToday;
    if(meal) meal.textContent = state.meal.countToday;
    if(state.sleepEndAt && new Date(state.sleepEndAt).getTime() > now){
      const left = new Date(state.sleepEndAt).getTime() - now;
      if(heading) heading.textContent = "睡眠模式中";
      if(time) time.textContent = formatCountdown(left, true);
      if(meta) meta.textContent = "睡醒先喝水，再碰下一題。";
      if(sleep) sleep.textContent = `睡眠倒數：${formatCountdown(left, true)}`;
      overlay.hidden = true;
      return;
    }
    if(state.sleepEndAt && new Date(state.sleepEndAt).getTime() <= now){
      state.sleepEndAt = null;
      state.mode = "study";
      state.message = "醒來。喝水。下一刀：刑法行為與三階層。";
      save(); render(); return;
    }
    if(sleep) sleep.textContent = "睡眠：未啟動";
    const snoozeUntil = h.snoozeUntil ? new Date(h.snoozeUntil).getTime() : 0;
    const next = new Date(h.nextDrinkAt).getTime();
    const soft = new Date(h.softOverlayAt).getTime();
    const takeover = new Date(h.takeoverAt).getTime();
    let level = "none";
    if(now >= next && now >= snoozeUntil) level = "reminder";
    if(now >= soft && now >= snoozeUntil) level = "soft";
    if(now >= takeover && now >= snoozeUntil) level = "takeover";
    h.isReminderActive = level !== "none";
    h.overlayLevel = level;
    if(level !== "none" && !h.reminderShownAt) h.reminderShownAt = new Date(next).toISOString();
    if(box) box.className = `crf-card crf-hydration ${level === "takeover" ? "danger" : level === "soft" ? "warning" : ""}`;
    if(level === "none"){
      if(heading) heading.textContent = "喝水監控";
      if(time) time.textContent = formatCountdown(next - now, true);
      if(meta) meta.textContent = `今日喝水：${h.waterCountToday} 次｜每 ${h.intervalMinutes} 分鐘提醒一次`;
      overlay.hidden = true;
    }else{
      const overdue = now - next;
      if(heading) heading.textContent = level === "takeover" ? "喝水接管中" : level === "soft" ? "喝水水印已啟動" : "喝水提醒中";
      if(time) time.textContent = `已逾時 ${formatCountdown(overdue, true)}`;
      if(meta) meta.textContent = level === "takeover" ? "喝水，然後再碰下一題。" : `透明水印：${formatCountdown(soft - now)}｜接管：${formatCountdown(takeover - now)}`;
      showHydrationOverlay(level);
    }
    save();
  }
  function showHydrationOverlay(level){
    if(state.mode === "sleep" || state.mode === "meal") return;
    if(level === "reminder"){ overlay.hidden = true; return; }
    if(state.mode !== "hydration") lastModeBeforeHydration = state.mode || "study";
    state.mode = "hydration";
    overlay.hidden = false;
    overlay.classList.toggle("takeover", level === "takeover");
    $("[data-crf-hydration-title]", overlay).textContent = level === "takeover" ? "妳看到了" : "喝水";
    $("[data-crf-hydration-subtitle]", overlay).textContent = level === "takeover" ? "水在旁邊。喝水，然後再碰下一題。" : "喝兩口，再繼續。";
    $("[data-crf-hydration-actions]", overlay).hidden = level !== "takeover";
  }
  function enableDrag(){
    let drag = null;
    panel.addEventListener("pointerdown", event => {
      const handle = event.target.closest("[data-crf-drag-handle]");
      if(!handle || event.target.closest("button,input,select,textarea,label,a,summary")) return;
      const rect = panel.getBoundingClientRect();
      drag = { dx:event.clientX - rect.left, dy:event.clientY - rect.top };
      panel.classList.add("crf-dragging");
      panel.setPointerCapture(event.pointerId);
    });
    panel.addEventListener("pointermove", event => {
      if(!drag) return;
      const width = panel.offsetWidth, height = panel.offsetHeight;
      const x = Math.max(8, Math.min(event.clientX - drag.dx, window.innerWidth - width - 8));
      const y = Math.max(8, Math.min(event.clientY - drag.dy, window.innerHeight - height - 8));
      panel.style.left = `${x}px`; panel.style.top = `${y}px`; panel.style.right = "auto"; panel.style.bottom = "auto";
      state.panelPosition = { x, y };
    });
    const end = event => {
      if(!drag) return;
      drag = null;
      panel.classList.remove("crf-dragging");
      try{ panel.releasePointerCapture(event.pointerId); }catch{}
      save();
    };
    panel.addEventListener("pointerup", end);
    panel.addEventListener("pointercancel", end);
  }
  function bindEvents(){
    panel.addEventListener("click", event => {
      const action = event.target.closest("[data-crf-action]")?.dataset.crfAction;
      if(action === "toggle"){ state.collapsed = !state.collapsed; save(); render(); return; }
      if(action === "next-item"){ markNext(); return; }
      if(action === "open-reader"){ openChapter(DATA.chapters.indexOf(activeChapter())); return; }
      if(action === "open-quiz"){ openView("quiz"); return; }
      if(action === "toggle-hide"){ state.hideDone = !state.hideDone; save(); render(); return; }
      if(action === "reset"){ resetAll(); return; }
      if(action === "drink"){ confirmHydration(); return; }
      if(action === "no-water"){ noWater(); return; }
      if(action === "meal"){ startMeal(); return; }
      if(action === "sleep"){ startSleep(); return; }
      if(action === "cancel-sleep"){ state.sleepEndAt = null; state.mode = "study"; state.message = "睡眠已取消｜回到教材。"; save(); render(); return; }
      if(action === "expand-all"){ DATA.chapters.forEach(ch => state.expanded[ch.id] = true); save(); render(); return; }
      if(action === "collapse-all"){ DATA.chapters.forEach(ch => state.expanded[ch.id] = false); save(); render(); return; }
      const go = event.target.closest("[data-crf-go-chapter]");
      if(go){ openChapter(Number(go.dataset.crfGoChapter)); return; }
      const seal = event.target.closest("[data-crf-seal]");
      if(seal){ sealChapter(seal.dataset.crfSeal); return; }
    });
    panel.addEventListener("change", event => {
      const chapterId = event.target.dataset.crfChapterCheck;
      if(chapterId){
        state.chapters[chapterId] = state.chapters[chapterId].map(() => event.target.checked);
        state.lastTaskCompletedAt = nowISO();
        save(); render(); return;
      }
      const itemId = event.target.dataset.crfItem;
      if(itemId){
        state.chapters[itemId][Number(event.target.dataset.crfItemIndex)] = event.target.checked;
        state.lastTaskCompletedAt = nowISO();
        save(); render(); return;
      }
    });
    panel.addEventListener("toggle", event => {
      const detail = event.target.closest("[data-crf-chapter]");
      if(detail){ state.expanded[detail.dataset.crfChapter] = detail.open; save(); }
    }, true);
    overlay.addEventListener("click", event => {
      const action = event.target.closest("[data-crf-action]")?.dataset.crfAction;
      if(action === "drink") confirmHydration();
      if(action === "no-water") noWater();
    });
    window.addEventListener("resize", updateProgressVisuals);
  }
  function init(){
    render();
    bindEvents();
    enableDrag();
    updateHydrationCountdown();
    timer = setInterval(updateHydrationCountdown, 1000);
  }
  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", init); else init();
})();
</script>
<!-- Criminal Rose Floating Console END -->
</body>
</html>
